name: UWP Build X64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: UWP Build (x64)
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Enable GitHub Actions cache for vcpkg
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build UWP Package
        shell: pwsh
        working-directory: platform/uwp
        run: |
          $env:VERSION_BUILD_NUMBER = "${{ github.run_number }}"
          .\build-ci.ps1

      - name: Upload UWP Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wiliwili-uwp-X64
          path: |
            platform/uwp/build/AppPackages/wiliwili-uwp/*/*.msixbundle
            platform/uwp/build/AppPackages/wiliwili-uwp/*/*.msix
            platform/uwp/build/AppPackages/wiliwili-uwp/*/*.appx
            platform/uwp/build/AppPackages/wiliwili-uwp/*/*.cer
            platform/uwp/build/AppPackages/wiliwili-uwp/*/Dependencies/x64/*
